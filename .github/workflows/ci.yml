name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "poetry==2.3.2"
      - run: poetry install --no-interaction --with dev
      - run: poetry run ruff check .
      - run: poetry run pytest tests/
