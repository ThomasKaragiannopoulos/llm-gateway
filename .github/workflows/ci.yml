name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install "poetry==2.3.2"
      - name: Install dependencies
        run: poetry install --no-interaction --with dev
      - name: Ruff
        run: poetry run ruff check .
      - name: Mypy
        run: poetry run mypy app tests scripts
      - name: Pytest
        run: poetry run pytest --cov=app --cov-report=term-missing --cov-fail-under=75
