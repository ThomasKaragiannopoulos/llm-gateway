services:
  gateway:
    build: .
    container_name: llm-gateway
    ports:
      - "8000:8000"
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-llm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_gateway}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://llm:llm@postgres:5432/llm_gateway
      ALLOW_ADMIN_RESET: "true"
      APP_ENV: dev
      PROMETHEUS_URL: http://prometheus:9090
      ADMIN_API_KEY: sk-admin-demo
      BOOTSTRAP_ADMIN_TOKEN: bootstrap-admin-token
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: llm-postgres
    ports:
      - "1312:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-llm_gateway}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm} -d ${POSTGRES_DB:-llm_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: llm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: llm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    container_name: llm-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  gateway_data:
  postgres_data:
  grafana_data:
